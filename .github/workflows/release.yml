name: Preview release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "WIKEY_VERSION=$version" >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Build preview DMG
        run: ./script/package_release.sh "$WIKEY_VERSION" "$GITHUB_RUN_NUMBER"

      - name: Verify checksum
        run: shasum -a 256 -c "dist/Wikey-$WIKEY_VERSION.dmg.sha256"

      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(mktemp)"
          printf '%s\n\n%s\n' \
            'This is an open-source preview build and has not been notarized by Apple.' \
            'See docs/INSTALL.md before installing.' > "$notes"

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              "dist/Wikey-$WIKEY_VERSION.dmg" \
              "dist/Wikey-$WIKEY_VERSION.dmg.sha256" \
              --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              "dist/Wikey-$WIKEY_VERSION.dmg" \
              "dist/Wikey-$WIKEY_VERSION.dmg.sha256" \
              --title "Wikey $WIKEY_VERSION" \
              --notes-file "$notes" \
              --generate-notes \
              --prerelease \
              --verify-tag
          fi
