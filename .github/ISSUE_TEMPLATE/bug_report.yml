name: 버그 제보
description: 재현 가능한 Wikey 문제를 알려주세요.
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 템플릿 내용, 앱 목록, 창 제목 등 개인정보가 화면과 로그에 포함되지 않았는지 먼저 확인해주세요.
  - type: input
    id: version
    attributes:
      label: Wikey 버전
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 버전
      placeholder: macOS 15.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 다시 확인할 수 있도록 순서대로 적어주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상한 동작
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 실제 동작
    validations:
      required: true
  - type: dropdown
    id: permissions
    attributes:
      label: 권한 상태
      options:
        - 손쉬운 사용과 입력 모니터링 모두 켜짐
        - 손쉬운 사용만 켜짐
        - 입력 모니터링만 켜짐
        - 모두 꺼짐
        - 확인하지 못함
    validations:
      required: true
