name: 기능 제안
description: Wikey로 해결하고 싶은 반복 작업을 알려주세요.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 일을 반복하고 있는지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 원하는 동작
      description: 단축키를 누른 뒤 어떤 순서로 동작하면 좋은지 적어주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 현재 사용 중인 방법
