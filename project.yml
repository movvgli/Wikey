name: Wikey
options:
  bundleIdPrefix: com.wikey
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1002000"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  WikeyCore:
    type: framework
    platform: macOS
    sources:
      - Sources/WikeyCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wikey.core
        GENERATE_INFOPLIST_FILE: YES

  WikeyLoginHelper:
    type: application
    platform: macOS
    sources:
      - Sources/WikeyLoginHelper
    info:
      path: Resources/WikeyLoginHelper-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wikey.login-helper
        PRODUCT_NAME: WikeyLoginHelper
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

  Wikey:
    type: application
    platform: macOS
    sources:
      - Sources/Wikey
    info:
      path: Resources/Wikey-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "15.0"
        SUEnableAutomaticChecks: true
        SUAutomaticallyUpdate: false
        SUFeedURL: https://raw.githubusercontent.com/movvgli/Wikey/update-feed/appcast.xml
        SUPublicEDKey: KYMCwU1bB70rz+f0DguhjotRDSs/5nrJqSRul09YeZE=
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wikey.app
        PRODUCT_NAME: Wikey
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
    dependencies:
      - target: WikeyCore
      - target: WikeyLoginHelper
        embed: false
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      - name: Embed Login Helper
        basedOnDependencyAnalysis: false
        script: |
          set -e
          destination="${TARGET_BUILD_DIR}/${WRAPPER_NAME}/Contents/Library/LoginItems"
          mkdir -p "${destination}"
          rm -rf "${destination}/WikeyLoginHelper.app"
          cp -R "${BUILT_PRODUCTS_DIR}/WikeyLoginHelper.app" "${destination}/"
    scheme:
      testTargets:
        - WikeyCoreTests

  WikeyCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/WikeyCoreTests
    dependencies:
      - target: WikeyCore
